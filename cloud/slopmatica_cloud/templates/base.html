<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Slopmatica Cloud{% endblock %}</title>
<link rel="icon" href="{{ base }}/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ base }}/static/style.css?v={{ v }}">
</head>
<body data-base="{{ base }}">
<header class="topbar">
  <a class="brand" href="{{ base }}/"><img src="{{ base }}/static/icon.svg" alt="" width="24" height="24"> <span>Slopmatica Cloud</span></a>
  <nav class="nav" aria-label="Main">
    {% if user %}<a class="btn small ghost nav-files{{ ' on' if nav == 'files' else '' }}" href="{{ base }}/"{% if nav == "files" %} aria-current="page"{% endif %}>My files</a>{% endif %}
    <a class="btn small nav-board{{ ' on' if nav == 'board' else '' }}" href="{{ base }}/board"{% if nav == "board" %} aria-current="page"{% endif %}><span class="long">Schematics board</span><span class="short">Board</span></a>
    <a class="btn small ghost nav-releases{{ ' on' if nav == 'releases' else '' }}" href="{{ base }}/releases"{% if nav == "releases" %} aria-current="page"{% endif %}>Releases</a>
  </nav>
  {% if user %}
  <div class="who">
    <a class="who-link{{ ' on' if nav == 'account' else '' }}" href="{{ base }}/account" title="Account and password"{% if nav == "account" %} aria-current="page"{% endif %}>
      <img class="head" src="https://mc-heads.net/avatar/{{ user.uuid }}/32" alt="Account" width="32" height="32">
      <span class="who-name">{{ user.name }}</span>
    </a>
    <form method="post" action="{{ base }}/logout"><button class="btn ghost small" type="submit">Log out</button></form>
  </div>
  {% endif %}
</header>
<main class="wrap">
{% block main %}{% endblock %}
</main>
<footer class="wrap foot">Slopmatica Cloud &middot; schematic sync for the Slopmatica mod &middot; <a href="{{ base }}/feedback">Made by Sputniknull + Claude</a></footer>
<script src="{{ base }}/static/app.js?v={{ v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
