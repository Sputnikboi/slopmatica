plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'java'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Online features (cloud, profiles, updates, usage reports, board, bug reports) live in
// src/online and reach the rest of the mod only through online/Online.java. The normal build
// includes them; the local-only edition compiles src/main with src/local's stand-in instead,
// so it doesn't contain the online code at all. -PlocalEdition runs the dev client as the
// local edition.
sourceSets {
    main {
        java {
            srcDir project.hasProperty('localEdition') ? 'src/local/java' : 'src/online/java'
        }
    }
}

def localClasses = layout.buildDirectory.dir('classes/java/local')

tasks.register('compileLocalJava', JavaCompile) {
    description = 'Compiles the local-only edition (no online code).'
    source = files('src/main/java', 'src/local/java')
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = localClasses
    options.release = 25
}

tasks.register('verifyLocalJava') {
    description = 'Fails if the local-only edition refers to anything online.'
    dependsOn 'compileLocalJava'
    inputs.dir(localClasses)
    doLast {
        def forbidden = ['com/sputnikboi/slopmatica/cloud/', 'com/sputnikboi/slopmatica/telemetry/', 'com/sputnikboi/slopmatica/update/',
                         'java/net/http/', 'java/net/URLConnection', 'java/net/Socket']
        def bad = []
        localClasses.get().asFile.eachFileRecurse { f ->
            if (f.name.endsWith('.class')) {
                def text = new String(f.bytes, 'ISO-8859-1')
                forbidden.each { if (text.contains(it)) bad << "${f.name}: ${it}" }
            }
        }
        if (!bad.isEmpty()) {
            throw new GradleException("Local-only edition refers to online code:\n" + bad.join('\n'))
        }
    }
}

tasks.register('localJar', Jar) {
    description = 'Packs the local-only edition: slopmatica-local-<version>.jar.'
    dependsOn 'verifyLocalJava', 'processResources'
    archiveBaseName = 'slopmatica-local'
    from(localClasses)
    from(sourceSets.main.output.resourcesDir) {
        filesMatching('fabric.mod.json') {
            filter { line -> line.replace('"name": "Slopmatica"', '"name": "Slopmatica (local only)"')
                .replace('https://homeserver.taila182df.ts.net/slopmatica', 'https://github.com/Sputnikboi/slopmatica') }
        }
    }
}

tasks.named('build') {
    dependsOn 'localJar'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    // Passes -Dslopmatica.colors=<file> through to BlockColorTableTool (website colour table).
    if (System.getProperty('slopmatica.colors')) {
        systemProperty 'slopmatica.colors', System.getProperty('slopmatica.colors')
    }
    if (System.getProperty('slopmatica.testschematic')) {
        systemProperty 'slopmatica.testschematic', System.getProperty('slopmatica.testschematic')
    }
}

loom {
    runs {
        server {
            runDir "run-server"
        }
        client {
            // Headless testing: ./gradlew runClient -PdevScript=/abs/path/script.txt
            if (project.hasProperty('devScript')) {
                vmArg "-Dslopmatica.dev.script=${project.property('devScript')}"
            }
            // Cloud login against a test server with a fake Mojang check: skip the real session join.
            if (project.hasProperty('devSkipJoin')) {
                vmArg "-Dslopmatica.dev.skipJoin=true"
            }
            if (project.hasProperty('devDebugEasyPlace')) {
                vmArg "-Dslopmatica.debug.easyplace=true"
            }
        }
    }
}
