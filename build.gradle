plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'java'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    // Passes -Dslopmatica.colors=<file> through to BlockColorTableTool (website colour table).
    if (System.getProperty('slopmatica.colors')) {
        systemProperty 'slopmatica.colors', System.getProperty('slopmatica.colors')
    }
}

loom {
    runs {
        server {
            runDir "run-server"
        }
        client {
            // Headless testing: ./gradlew runClient -PdevScript=/abs/path/script.txt
            if (project.hasProperty('devScript')) {
                vmArg "-Dslopmatica.dev.script=${project.property('devScript')}"
            }
            // Cloud login against a test server with a fake Mojang check: skip the real session join.
            if (project.hasProperty('devSkipJoin')) {
                vmArg "-Dslopmatica.dev.skipJoin=true"
            }
        }
    }
}
